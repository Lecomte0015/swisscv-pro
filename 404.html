<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Page introuvable — SwissCV Pro</title>
    <!-- Identité visuelle (logo, icônes) -->
    <link rel="icon" href="/favicon.ico" sizes="48x48">
    <link rel="icon" href="/brand/icon.svg" type="image/svg+xml">
    <link rel="apple-touch-icon" href="/brand/apple-touch-icon.png">
    <link rel="manifest" href="/site.webmanifest">
    <meta name="theme-color" content="#D50000">
    <link rel="stylesheet" href="/brand/brand.css">
    <meta property="og:image" content="https://swisscv-pro.ch/brand/og-image.png">
    <meta property="og:image:width" content="1200">
    <meta property="og:image:height" content="630">
    <meta property="og:image:alt" content="SwissCV Pro — Décrochez plus d'entretiens en Suisse">
    <meta property="og:site_name" content="SwissCV Pro">
    <meta name="twitter:card" content="summary_large_image">
    <meta name="robots" content="noindex, nofollow">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        :root { --swiss-red: #D50000; --swiss-black: #0D0D0D; --gray-100: #F5F5F5; --gray-200: #E5E5E5; --gray-600: #666666; }
        body { font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif; background: #FFFFFF; color: #333; }
        .header { background: white; border-bottom: 2px solid var(--gray-200); padding: 16px 0; }
        .header-content { max-width: 1200px; margin: 0 auto; padding: 0 40px; }
        .logo { font-size: 20px; font-weight: 800; color: var(--swiss-black); text-decoration: none; }
        .wrap { min-height: 60vh; display: flex; align-items: center; justify-content: center; text-align: center; padding: 60px 24px; }
        .code { font-size: 96px; font-weight: 900; color: var(--swiss-red); line-height: 1; margin-bottom: 12px; }
        h1 { font-size: 24px; font-weight: 700; color: var(--swiss-black); margin-bottom: 12px; }
        p { font-size: 15px; color: var(--gray-600); margin-bottom: 28px; }
        .btn-cta { background: var(--swiss-red); color: white; padding: 12px 28px; border-radius: 4px; text-decoration: none; font-weight: 600; font-size: 14px; display: inline-block; margin-right: 8px; }
        .btn-secondary { color: var(--swiss-black); padding: 12px 28px; border-radius: 4px; text-decoration: none; font-weight: 600; font-size: 14px; display: inline-block; background: var(--gray-100); }
    </style>
</head>

<body>
    <header class="header">
        <div class="header-content">
            <a href="/" class="logo">SwissCV Pro</a>
        </div>
    </header>
    <div class="wrap">
        <div>
            <div class="code">404</div>
            <h1>Cette page n'existe pas</h1>
            <p>Le lien que vous avez suivi est peut-être obsolète, ou l'adresse comporte une erreur.</p>
            <a href="/" class="btn-cta">Retour à l'accueil</a>
            <a href="/app.html" class="btn-secondary">Analyser mon CV</a>
        </div>
    </div>
</body>
</html>
