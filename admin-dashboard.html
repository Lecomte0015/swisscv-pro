<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard Admin — SwissCV Pro</title>
    <!-- Identité visuelle (logo, icônes) -->
    <link rel="icon" href="/favicon.ico" sizes="48x48">
    <link rel="icon" href="/brand/icon.svg" type="image/svg+xml">
    <link rel="apple-touch-icon" href="/brand/apple-touch-icon.png">
    <link rel="manifest" href="/site.webmanifest">
    <meta name="theme-color" content="#D50000">
    <link rel="stylesheet" href="/brand/brand.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="admin/css/notifications.css">
    <link rel="stylesheet" href="admin/css/dark-mode.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', -apple-system, sans-serif;
            background: #F8F9FA;
            color: #1f2937;
        }

        /* Admin Navbar */
        .admin-navbar {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            padding: 16px 32px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 2px 12px rgba(0, 0, 0, 0.1);
        }

        .admin-navbar h1 {
            color: white;
            font-size: 24px;
            font-weight: 800;
        }

        .admin-nav-links {
            display: flex;
            gap: 24px;
            align-items: center;
        }

        .admin-nav-links a {
            color: white;
            text-decoration: none;
            font-weight: 600;
            font-size: 15px;
            padding: 8px 16px;
            border-radius: 6px;
            transition: all 0.2s;
        }

        .admin-nav-links a:hover {
            background: rgba(255, 255, 255, 0.2);
        }

        .admin-nav-links a.active {
            background: rgba(255, 255, 255, 0.3);
        }

        .logout-btn {
            background: rgba(255, 255, 255, 0.2);
            border: 2px solid white;
            color: white;
            padding: 8px 20px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.2s;
        }

        .logout-btn:hover {
            background: white;
            color: #667eea;
        }

        /* Container */
        .container {
            max-width: 1400px;
            margin: 32px auto;
            padding: 0 32px;
        }

        /* Stats Grid */
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 24px;
            margin-bottom: 32px;
        }

        .stat-card {
            background: white;
            padding: 24px;
            border-radius: 12px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
            border-left: 4px solid;
        }

        .stat-card.users {
            border-color: #667eea;
        }

        .stat-card.premium {
            border-color: #f59e0b;
        }

        .stat-card.analyses {
            border-color: #10b981;
        }

        .stat-card.revenue {
            border-color: #ef4444;
        }

        .stat-card h3 {
            font-size: 14px;
            color: #6b7280;
            font-weight: 600;
            margin-bottom: 8px;
        }

        .stat-card .value {
            font-size: 32px;
            font-weight: 800;
            color: #1f2937;
            margin-bottom: 4px;
        }

        .stat-card .change {
            font-size: 13px;
            font-weight: 600;
        }

        .stat-card .change.positive {
            color: #10b981;
        }

        .stat-card .change.negative {
            color: #ef4444;
        }

        /* Charts */
        .charts-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(400px, 1fr));
            gap: 24px;
            margin-bottom: 32px;
        }

        .chart-card {
            background: white;
            padding: 24px;
            border-radius: 12px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
        }

        .chart-card h3 {
            font-size: 18px;
            font-weight: 700;
            margin-bottom: 20px;
            color: #1f2937;
        }

        /* Activity Feed */
        .activity-card {
            background: white;
            padding: 24px;
            border-radius: 12px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
        }

        .activity-item {
            padding: 16px 0;
            border-bottom: 1px solid #e5e7eb;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .activity-item:last-child {
            border-bottom: none;
        }

        .activity-info {
            flex: 1;
        }

        .activity-info strong {
            color: #1f2937;
            font-weight: 600;
        }

        .activity-info p {
            font-size: 14px;
            color: #6b7280;
            margin-top: 4px;
        }

        .activity-time {
            font-size: 13px;
            color: #9ca3af;
        }

        .loading {
            text-align: center;
            padding: 60px;
            color: #6b7280;
        }

        @media (max-width: 768px) {
            .admin-navbar {
                flex-direction: column;
                gap: 16px;
                padding: 16px;
            }

            .admin-nav-links {
                flex-direction: column;
                gap: 8px;
                width: 100%;
            }

            .admin-nav-links a {
                width: 100%;
                text-align: center;
            }

            .container {
                padding: 0 16px;
            }

            .stats-grid {
                grid-template-columns: 1fr;
            }

            .charts-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
    <script src="admin/js/session-guard.js"></script>
    <link rel="stylesheet" href="admin/css/admin-shell.css">
    <script src="admin/js/admin-shell.js"></script>
</head>

<body>
    <!-- Admin Navbar -->
    <div class="container">
        <!-- Stats Cards -->
        <div class="stats-grid">
            <div class="stat-card users">
                <h3>Total Utilisateurs</h3>
                <div class="value" id="totalUsers">-</div>
                <div class="change positive" id="totalUsersChange"></div>
            </div>
            <div class="stat-card premium">
                <h3>Utilisateurs Premium</h3>
                <div class="value" id="premiumUsers">-</div>
            </div>
            <div class="stat-card analyses">
                <h3>Analyses CV</h3>
                <div class="value" id="totalAnalyses">-</div>
                <div class="change positive" id="totalAnalysesChange"></div>
            </div>
            <div class="stat-card revenue">
                <h3>Revenus (MRR)</h3>
                <div class="value" id="revenue">-</div>
            </div>
        </div>

        <!-- Charts -->
        <div class="charts-grid">
            <div class="chart-card">
                <h3>Inscriptions (7 derniers jours)</h3>
                <canvas id="registrationsChart"></canvas>
            </div>
            <div class="chart-card">
                <h3>Répartition Plans</h3>
                <canvas id="plansChart"></canvas>
                <p id="plansNote" style="margin:12px 0 0;font-size:13px;color:#6b7280;line-height:1.4;"></p>
            </div>
        </div>

        <!-- Activity Feed -->
        <div class="activity-card">
            <h3>Activité Récente</h3>
            <div id="activityFeed">
                <div class="loading">Chargement...</div>
            </div>
        </div>
    </div>

    <script src="admin/js/notifications.js"></script>
    <script>
        const API_BASE = 'https://swisscv-pro.dallyhermann-71e.workers.dev';

        function getAdminToken() {
            return localStorage.getItem('admin_token');
        }

        function logout() {
            localStorage.removeItem('admin_token');
            localStorage.removeItem('admin_user');
            window.location.href = 'admin-login.html';
        }

        // Vérifier auth
        if (!getAdminToken()) {
            window.location.href = 'admin-login.html';
        }

        // Charger stats
        async function loadStats() {
            try {
                // Stats overview (utilise /admin/stats)
                const statsResponse = await fetch(`${API_BASE}/admin/stats`, {
                    headers: { 'Authorization': `Bearer ${getAdminToken()}` }
                });
                const statsData = await statsResponse.json();
                console.log('Stats loaded:', statsData);

                // L'API retourne { success: true, stats: { ... } }
                const stats = statsData.stats || statsData;

                // Metrics (MRR, etc.)
                const metricsResponse = await fetch(`${API_BASE}/admin/metrics`, {
                    headers: { 'Authorization': `Bearer ${getAdminToken()}` }
                });
                const metricsData = await metricsResponse.json();
                console.log('Metrics loaded:', metricsData);
                const metrics = metricsData.metrics || metricsData;

                // Mettre à jour les stats
                const totalUsersEl = document.getElementById('totalUsers');
                if (totalUsersEl) totalUsersEl.textContent = stats.total_users || 0;
                const totalUsersChangeEl = document.getElementById('totalUsersChange');
                if (totalUsersChangeEl) totalUsersChangeEl.textContent = `+${stats.new_users_this_month || 0} ce mois`;

                const premiumUsersEl = document.getElementById('premiumUsers');
                if (premiumUsersEl) premiumUsersEl.textContent = ((stats.premium_users || 0) + (stats.pro_users || 0));

                const totalAnalysesEl = document.getElementById('totalAnalyses');
                if (totalAnalysesEl) totalAnalysesEl.textContent = stats.total_analyses || 0;
                const totalAnalysesChangeEl = document.getElementById('totalAnalysesChange');
                if (totalAnalysesChangeEl) totalAnalysesChangeEl.textContent = `${stats.analyses_this_month || 0} ce mois`;

                const revenueEl = document.getElementById('revenue');
                if (revenueEl) revenueEl.textContent = metrics.mrr ? `CHF ${metrics.mrr}` : (stats.revenue_monthly ? `CHF ${stats.revenue_monthly}` : '-');

                // Charts avec vraies données
                createRegistrationsChart(metrics.monthly_registrations || {});
                createPlansChart(stats);

            } catch (error) {
                console.error('Error loading stats:', error);
            }
        }

        function createRegistrationsChart(registrationsByDay) {
            // Convertir l'objet en tableau pour les 7 derniers jours
            const days = Object.keys(registrationsByDay).slice(-7);
            const values = days.map(day => registrationsByDay[day] || 0);

            const ctx = document.getElementById('registrationsChart');
            if (!ctx) {
                console.error('Element #registrationsChart not found');
                return;
            }
            new Chart(ctx, {
                type: 'line',
                data: {
                    labels: days.length > 0 ? days : ['Lun', 'Mar', 'Mer', 'Jeu', 'Ven', 'Sam', 'Dim'],
                    datasets: [{
                        label: 'Inscriptions',
                        data: values.length > 0 ? values : [0, 0, 0, 0, 0, 0, 0],
                        borderColor: '#667eea',
                        backgroundColor: 'rgba(102, 126, 234, 0.1)',
                        tension: 0.4
                    }]
                },
                options: {
                    responsive: true,
                    plugins: {
                        legend: { display: false }
                    }
                }
            });
        }

        function createPlansChart(stats) {
            const ctx = document.getElementById('plansChart');
            if (!ctx) {
                console.error('Element #plansChart not found');
                return;
            }
            new Chart(ctx, {
                type: 'doughnut',
                data: {
                    // Une recharge de crédits ou le Pack ne change pas le plan : ces comptes sont des « Free » qui ont acheté
                    labels: ['Free', 'Free + recharge crédits', 'Free + Pack', 'Premium', 'Pro'],
                    datasets: [{
                        data: [
                            Math.max(0, (stats.free_users || 0) - (stats.free_credit_buyers || 0) - (stats.free_pack_buyers || 0)),
                            stats.free_credit_buyers || 0,
                            stats.free_pack_buyers || 0,
                            stats.premium_users || 0,
                            stats.pro_users || 0
                        ],
                        backgroundColor: ['#e5e7eb', '#D50000', '#10b981', '#f59e0b', '#667eea']
                    }]
                },
                options: {
                    responsive: true
                }
            });
            const note = document.getElementById('plansNote');
            if (note) {
                const buyers = stats.credit_buyers_all_plans || 0;
                note.textContent = buyers
                    ? 'Recharges de crédits : ' + buyers + ' client' + (buyers > 1 ? 's' : '') + ' (tous plans), ' + (stats.credit_purchases || 0) + ' achat' + ((stats.credit_purchases || 0) > 1 ? 's' : '') + ', ' + (stats.credits_sold || 0) + ' crédits vendus.'
                    : 'Aucune recharge de crédits pour le moment.';
            }
        }

        // Activité récente (vraies données)
        async function loadActivity() {
            try {
                const response = await fetch(`${API_BASE}/admin/activity`, {
                    headers: { 'Authorization': `Bearer ${getAdminToken()}` }
                });
                const data = await response.json();

                const feed = document.getElementById('activityFeed');
                if (!feed) {
                    console.error('Element #activityFeed not found');
                    return;
                }

                if (!data.activities || data.activities.length === 0) {
                    feed.innerHTML = '<div class="loading">Aucune activité récente</div>';
                    return;
                }

                feed.innerHTML = data.activities.map(activity => {
                    const timeAgo = getTimeAgo(activity.timestamp);

                    if (activity.type === 'registration') {
                        return `
                            <div class="activity-item">
                                <div class="activity-info">
                                    <strong>Nouvel utilisateur ${activity.tier.toUpperCase()}</strong>
                                    <p>${activity.email} s'est inscrit</p>
                                </div>
                                <div class="activity-time">${timeAgo}</div>
                            </div>
                        `;
                    } else if (activity.type === 'analysis') {
                        return `
                            <div class="activity-item">
                                <div class="activity-info">
                                    <strong>Analyse CV</strong>
                                    <p>${activity.filename || 'CV analysé'}</p>
                                </div>
                                <div class="activity-time">${timeAgo}</div>
                            </div>
                        `;
                    }
                }).join('');

            } catch (error) {
                console.error('Error loading activity:', error);
                document.getElementById('activityFeed').innerHTML =
                    '<div class="loading">Erreur de chargement</div>';
            }
        }

        function getTimeAgo(timestamp) {
            const now = new Date();
            // timestamp vient de la DB en secondes (unixepoch), Date() attend des millisecondes
            const date = new Date(timestamp * 1000);
            const seconds = Math.floor((now - date) / 1000);

            if (seconds < 60) return 'Il y a quelques secondes';
            if (seconds < 3600) return `Il y a ${Math.floor(seconds / 60)} min`;
            if (seconds < 86400) return `Il y a ${Math.floor(seconds / 3600)}h`;
            return `Il y a ${Math.floor(seconds / 86400)}j`;
        }

        // Initialiser quand le DOM est prêt
        function initDashboard() {
            if (typeof initNotifications === 'function') {
                initNotifications();
            }
            loadStats();
            loadActivity();
        }

        // Exécuter immédiatement si DOM déjà chargé, sinon attendre
        if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', initDashboard);
        } else {
            initDashboard();
        }
    </script>
</body>

</html>
