<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Analytics — Admin SwissCV Pro</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="admin/css/notifications.css">
    <link rel="stylesheet" href="admin/css/dark-mode.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: #F8F9FA;
            color: #1f2937;
        }

        .admin-navbar {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            padding: 16px 32px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 2px 12px rgba(0, 0, 0, 0.1);
        }

        .admin-navbar h1 {
            color: white;
            font-size: 24px;
            font-weight: 800;
        }

        .admin-nav-links {
            display: flex;
            gap: 24px;
            align-items: center;
        }

        .admin-nav-links a {
            color: white;
            text-decoration: none;
            font-weight: 600;
            font-size: 15px;
            padding: 8px 16px;
            border-radius: 6px;
            transition: all 0.2s;
        }

        .admin-nav-links a:hover {
            background: rgba(255, 255, 255, 0.2);
        }

        .admin-nav-links a.active {
            background: rgba(255, 255, 255, 0.3);
        }

        .logout-btn {
            background: rgba(255, 255, 255, 0.2);
            border: 2px solid white;
            color: white;
            padding: 8px 20px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 600;
        }

        .logout-btn:hover {
            background: white;
            color: #667eea;
        }

        .container {
            max-width: 1400px;
            margin: 32px auto;
            padding: 0 32px;
        }

        h2 {
            font-size: 28px;
            font-weight: 800;
            margin-bottom: 24px;
        }

        .metrics-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 24px;
            margin-bottom: 32px;
        }

        .metric-card {
            background: white;
            padding: 24px;
            border-radius: 12px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
        }

        .metric-card h3 {
            font-size: 14px;
            color: #6b7280;
            margin-bottom: 12px;
        }

        .metric-card .value {
            font-size: 36px;
            font-weight: 800;
            color: #1f2937;
        }

        .metric-card .trend {
            font-size: 14px;
            font-weight: 600;
            margin-top: 8px;
        }

        .metric-card .trend.up {
            color: #10b981;
        }

        .metric-card .trend.down {
            color: #ef4444;
        }

        .charts-section {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(450px, 1fr));
            gap: 24px;
            margin-bottom: 32px;
        }

        .chart-card {
            background: white;
            padding: 24px;
            border-radius: 12px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
        }

        .chart-card h3 {
            font-size: 18px;
            font-weight: 700;
            margin-bottom: 20px;
        }

        .export-btn {
            background: #667eea;
            color: white;
            padding: 12px 24px;
            border: none;
            border-radius: 6px;
            font-weight: 600;
            cursor: pointer;
            margin-bottom: 24px;
        }

        @media (max-width: 768px) {
            .admin-navbar {
                flex-direction: column;
                gap: 16px;
            }

            .admin-nav-links {
                flex-direction: column;
                width: 100%;
            }

            .admin-nav-links a {
                width: 100%;
                text-align: center;
            }

            .container {
                padding: 0 16px;
            }

            .charts-section {
                grid-template-columns: 1fr;
            }
        }
    </style>
    <script src="admin/js/session-guard.js"></script>
    <link rel="stylesheet" href="admin/css/admin-shell.css">
    <script src="admin/js/admin-shell.js"></script>
</head>

<body>
    <div class="container">
        <h2>📊 Analytics Avancées</h2>

        <button class="export-btn" onclick="exportData()">📥 Exporter CSV</button>

        <div class="metrics-grid">
            <div class="metric-card">
                <h3>Taux de Conversion</h3>
                <div class="value" id="conversionRate">-</div>
                <div class="trend" id="conversionNote" style="color:#9ca3af;font-weight:500;"></div>
            </div>
            <div class="metric-card">
                <h3>MRR (Monthly Recurring Revenue)</h3>
                <div class="value" id="mrr">-</div>
                <div class="trend" id="mrrNote" style="color:#9ca3af;font-weight:500;"></div>
            </div>
            <div class="metric-card">
                <h3>Churn Rate</h3>
                <div class="value" id="churnRate">-</div>
                <div class="trend" id="churnRateNote" style="color:#9ca3af;font-weight:500;"></div>
            </div>
            <div class="metric-card">
                <h3>LTV (Lifetime Value)</h3>
                <div class="value" id="ltv">-</div>
                <div class="trend" id="ltvNote" style="color:#9ca3af;font-weight:500;"></div>
            </div>
        </div>

        <div class="charts-section">
            <div class="chart-card">
                <h3>Croissance Utilisateurs (6 mois)</h3>
                <canvas id="growthChart"></canvas>
            </div>
            <div class="chart-card">
                <h3>Analyses CV par Jour</h3>
                <canvas id="analysesChart"></canvas>
            </div>
            <div class="chart-card">
                <h3>Revenus Mensuels</h3>
                <canvas id="revenueChart"></canvas>
                <p id="revenueChartNote" style="margin-top:8px;font-size:12px;color:#9ca3af;"></p>
            </div>
            <div class="chart-card">
                <h3>Funnel de Conversion</h3>
                <canvas id="funnelChart"></canvas>
            </div>
        </div>
    </div>

    <script>
        const API_BASE = 'https://swisscv-pro.dallyhermann-71e.workers.dev';

        function getAdminToken() { return localStorage.getItem('admin_token'); }
        function logout() {
            localStorage.removeItem('admin_token');
            localStorage.removeItem('admin_user');
            window.location.href = 'admin-login.html';
        }

        if (!getAdminToken()) window.location.href = 'admin-login.html';

        // Charger métriques réelles
        async function loadMetrics() {
            try {
                const response = await fetch(`${API_BASE}/admin/metrics`, {
                    headers: { 'Authorization': `Bearer ${getAdminToken()}` }
                });
                const data = await response.json();

                // Update metrics with null checks
                const elements = {
                    conversionRate: document.getElementById('conversionRate'),
                    mrr: document.getElementById('mrr'), // Corrected ID to 'mrr'
                    churnRate: document.getElementById('churnRate'),
                    ltv: document.getElementById('ltv')
                };

                if (elements.conversionRate) elements.conversionRate.textContent = `${data.conversion_rate || 0}%`;
                if (elements.mrr) elements.mrr.textContent = `CHF ${data.mrr || 0}`;
                const convNoteEl = document.getElementById('conversionNote');
                if (convNoteEl && data.real_users !== undefined) {
                    convNoteEl.textContent = `${data.paying_customers} client(s) payant(s) sur ${data.real_users} inscrits réels — voir l'onglet Marketing`;
                }
                const mrrNoteEl = document.getElementById('mrrNote');
                if (mrrNoteEl && data.mrr_basis === 'list_price') {
                    mrrNoteEl.textContent = 'Au tarif public, avant remises (ex. SWISS20)';
                }

                if (elements.churnRate) {
                    elements.churnRate.textContent = (data.churn_rate === null || data.churn_rate === undefined) ? 'N/D' : `${data.churn_rate}%`;
                }
                const churnRateNoteEl = document.getElementById('churnRateNote');
                if (churnRateNoteEl && (data.churn_rate === null || data.churn_rate === undefined)) {
                    churnRateNoteEl.textContent = 'Historique insuffisant';
                }

                if (elements.ltv) {
                    elements.ltv.textContent = (data.ltv === null || data.ltv === undefined) ? 'N/D' : `CHF ${data.ltv}`;
                }
                const ltvNoteEl = document.getElementById('ltvNote');
                if (ltvNoteEl && (data.ltv === null || data.ltv === undefined)) {
                    ltvNoteEl.textContent = 'Historique insuffisant';
                }

                // Créer graphiques avec vraies données
                createGrowthChart(data.monthly_registrations);
                createRevenueChart(data);
            } catch (error) {
                console.error('Error loading metrics:', error);
            }
        }

        // Growth Chart avec vraies données
        function createGrowthChart(monthlyData) {
            const months = Object.keys(monthlyData);
            const values = Object.values(monthlyData);

            new Chart(document.getElementById('growthChart'), {
                type: 'line',
                data: {
                    labels: months.length > 0 ? months : ['Jan', 'Fév', 'Mar', 'Avr', 'Mai', 'Juin'],
                    datasets: [{
                        label: 'Utilisateurs',
                        data: values.length > 0 ? values : [0, 0, 0, 0, 0, 0],
                        borderColor: '#667eea',
                        backgroundColor: 'rgba(102, 126, 234, 0.1)',
                        tension: 0.4
                    }]
                },
                options: { responsive: true }
            });
        }

        // Analyses Chart avec vraies données
        async function createAnalysesChart() {
            try {
                const canvas = document.getElementById('analysesChart');
                if (!canvas) {
                    console.error('Canvas element #analysesChart not found');
                    return;
                }

                const response = await fetch(`${API_BASE}/admin/analytics/analyses-daily`, {
                    headers: { 'Authorization': `Bearer ${getAdminToken()}` }
                });
                const data = await response.json();

                // Handle both array and object formats
                let chartData;
                if (Array.isArray(data)) {
                    // Data is already an array
                    chartData = data;
                } else if (data.dates && data.counts) {
                    // Data is an object with dates and counts arrays
                    chartData = data.dates.map((date, i) => ({
                        date: date,
                        count: data.counts[i] || 0
                    }));
                } else {
                    // Fallback to empty data
                    console.warn('Unexpected data format:', data);
                    chartData = [];
                }

                new Chart(canvas, {
                    type: 'line',
                    data: {
                        labels: chartData.length > 0
                            ? chartData.map(d => d.date || d)
                            : ['Lun', 'Mar', 'Mer', 'Jeu', 'Ven', 'Sam', 'Dim'],
                        datasets: [{
                            label: 'Analyses CV',
                            data: chartData.length > 0
                                ? chartData.map(d => d.count || 0)
                                : [0, 0, 0, 0, 0, 0, 0],
                            borderColor: '#10b981',
                            backgroundColor: 'rgba(16, 185, 129, 0.1)',
                            tension: 0.4
                        }]
                    },
                    options: {
                        responsive: true,
                        plugins: {
                            legend: { display: false }
                        }
                    }
                });
            } catch (error) {
                console.error('Error loading analyses chart:', error);
                // Fallback en cas d'erreur
                new Chart(document.getElementById('analysesChart'), {
                    type: 'bar',
                    data: {
                        labels: ['Lun', 'Mar', 'Mer', 'Jeu', 'Ven', 'Sam', 'Dim'],
                        datasets: [{
                            label: 'Analyses CV',
                            data: [0, 0, 0, 0, 0, 0, 0],
                            backgroundColor: '#10b981'
                        }]
                    },
                    options: { responsive: true }
                });
            }
        }


        // Revenue Chart avec vraies données
        function createRevenueChart(metrics) {
            const monthlyMrr = metrics.monthly_mrr || {};
            const months = Object.keys(monthlyMrr).sort();
            const monthLabels = { '01': 'Jan', '02': 'Fév', '03': 'Mar', '04': 'Avr', '05': 'Mai', '06': 'Juin', '07': 'Juil', '08': 'Août', '09': 'Sep', '10': 'Oct', '11': 'Nov', '12': 'Déc' };

            const labels = months.map(m => {
                const [year, month] = m.split('-');
                return `${monthLabels[month] || month} ${year}`;
            });
            const data = months.map(m => monthlyMrr[m]);

            const note = document.getElementById('revenueChartNote');
            if (note) {
                note.textContent = months.length <= 1
                    ? 'Suivi démarré récemment — l\'historique se construira jour après jour.'
                    : `Basé sur ${months.length} mois d'instantanés réels du MRR.`;
            }

            new Chart(document.getElementById('revenueChart'), {
                type: 'line',
                data: {
                    labels: labels.length ? labels : ['Aujourd\'hui'],
                    datasets: [{
                        label: 'Revenus (CHF)',
                        data: data.length ? data : [parseFloat(metrics.mrr) || 0],
                        borderColor: '#f59e0b',
                        backgroundColor: 'rgba(245, 158, 11, 0.1)',
                        spanGaps: false,
                        tension: 0.4
                    }]
                },
                options: { responsive: true }
            });
        }

        // Funnel Chart avec vraies données
        async function createFunnelChart() {
            try {
                const canvas = document.getElementById('funnelChart');
                if (!canvas) {
                    console.error('Canvas element #funnelChart not found');
                    return;
                }

                const response = await fetch(`${API_BASE}/admin/analytics/funnel`, {
                    headers: { 'Authorization': `Bearer ${getAdminToken()}` }
                });
                const data = await response.json();

                new Chart(canvas, {
                    type: 'bar',
                    data: {
                        labels: ['Visiteurs', 'Inscriptions', 'Analyses', 'Premium'],
                        datasets: [{
                            label: 'Utilisateurs',
                            data: [
                                data.visitors || 0,
                                data.signups || 0,
                                data.analyses || 0,
                                data.premium || 0
                            ],
                            backgroundColor: ['#667eea', '#764ba2', '#f59e0b', '#10b981']
                        }]
                    },
                    options: {
                        indexAxis: 'y',
                        responsive: true,
                        plugins: {
                            legend: { display: false }
                        }
                    }
                });
            } catch (error) {
                console.error('Error loading funnel chart:', error);
            }
        }


        async function exportData() {
            try {
                const response = await fetch(`${API_BASE}/admin/analytics/export`, {
                    headers: { 'Authorization': `Bearer ${getAdminToken()}` }
                });

                if (!response.ok) {
                    throw new Error('Export failed');
                }

                const blob = await response.blob();
                const url = window.URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = `analytics-${new Date().toISOString().split('T')[0]}.csv`;
                document.body.appendChild(a);
                a.click();
                document.body.removeChild(a);
                window.URL.revokeObjectURL(url);
            } catch (error) {
                console.error('Export error:', error);
                alert('Erreur lors de l\'export CSV');
            }
        }

        // Initialiser quand le DOM est prêt
        function initPage() {
            if (typeof initNotifications === 'function') {
                initNotifications();
            }
            // Init - Charger tous les graphiques
            loadMetrics();
            createAnalysesChart();
            createFunnelChart();
        }

        // Exécuter immédiatement si DOM déjà chargé, sinon attendre
        if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', initPage);
        } else {
            initPage();
        }
    </script>
    <script src="admin/js/notifications.js"></script>
</body>

</html>
