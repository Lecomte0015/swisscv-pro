<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Support — Admin SwissCV Pro</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="admin/css/notifications.css">
    <link rel="stylesheet" href="admin/css/dark-mode.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: #F8F9FA;
            color: #1f2937;
        }

        .admin-navbar {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            padding: 16px 32px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 2px 12px rgba(0, 0, 0, 0.1);
        }

        .admin-navbar h1 {
            color: white;
            font-size: 24px;
            font-weight: 800;
        }

        .admin-nav-links {
            display: flex;
            gap: 24px;
            align-items: center;
        }

        .admin-nav-links a {
            color: white;
            text-decoration: none;
            font-weight: 600;
            font-size: 15px;
            padding: 8px 16px;
            border-radius: 6px;
            transition: all 0.2s;
        }

        .admin-nav-links a:hover {
            background: rgba(255, 255, 255, 0.2);
        }

        .admin-nav-links a.active {
            background: rgba(255, 255, 255, 0.3);
        }

        .logout-btn {
            background: rgba(255, 255, 255, 0.2);
            border: 2px solid white;
            color: white;
            padding: 8px 20px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 600;
        }

        .logout-btn:hover {
            background: white;
            color: #667eea;
        }

        .container {
            max-width: 1400px;
            margin: 32px auto;
            padding: 0 32px;
        }

        h2 {
            font-size: 28px;
            font-weight: 800;
            margin-bottom: 24px;
        }

        .stats-row {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 16px;
            margin-bottom: 32px;
        }

        .stat-box {
            background: white;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
            text-align: center;
        }

        .stat-box .number {
            font-size: 32px;
            font-weight: 800;
            color: #1f2937;
        }

        .stat-box .label {
            font-size: 13px;
            color: #6b7280;
            margin-top: 4px;
        }

        .filters {
            background: white;
            padding: 16px;
            border-radius: 12px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
            margin-bottom: 24px;
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
        }

        .filters select {
            padding: 10px 16px;
            border: 2px solid #e5e7eb;
            border-radius: 6px;
            font-size: 14px;
            flex: 1;
            min-width: 150px;
        }

        .tickets-list {
            background: white;
            border-radius: 12px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
        }

        .ticket-item {
            padding: 20px;
            border-bottom: 1px solid #e5e7eb;
            cursor: pointer;
            transition: background 0.2s;
        }

        .ticket-item:hover {
            background: #f9fafb;
        }

        .ticket-item:last-child {
            border-bottom: none;
        }

        .ticket-message {
            white-space: pre-wrap;
        }

        .modal-overlay {
            display: none;
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(17, 24, 39, 0.5);
            z-index: 1000;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .modal-overlay.open {
            display: flex;
        }

        .modal-box {
            background: white;
            border-radius: 12px;
            max-width: 640px;
            width: 100%;
            max-height: 85vh;
            overflow-y: auto;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
        }

        .modal-box-header {
            padding: 20px 24px;
            border-bottom: 1px solid #e5e7eb;
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            gap: 16px;
        }

        .modal-box-header h3 {
            font-size: 18px;
            color: #1f2937;
        }

        .modal-close-btn {
            background: none;
            border: none;
            font-size: 22px;
            cursor: pointer;
            color: #6b7280;
            line-height: 1;
        }

        .modal-box-body {
            padding: 24px;
        }

        .modal-meta-row {
            display: flex;
            flex-wrap: wrap;
            gap: 8px 16px;
            margin-bottom: 16px;
            font-size: 14px;
            color: #4b5563;
        }

        .modal-message-box {
            background: #f9fafb;
            border-radius: 8px;
            padding: 16px;
            white-space: pre-wrap;
            font-size: 14px;
            line-height: 1.6;
            color: #1f2937;
            margin-bottom: 20px;
        }

        .modal-actions {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }

        .modal-actions select {
            padding: 8px 12px;
            border-radius: 8px;
            border: 1px solid #d1d5db;
        }

        .modal-actions button {
            padding: 8px 16px;
            border-radius: 8px;
            border: none;
            background: #667eea;
            color: white;
            font-weight: 600;
            cursor: pointer;
        }

        .modal-actions button:hover {
            background: #5568d3;
        }

        .ticket-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 8px;
        }

        .ticket-title {
            font-size: 16px;
            font-weight: 700;
            color: #1f2937;
        }

        .ticket-meta {
            display: flex;
            gap: 12px;
            font-size: 13px;
            color: #6b7280;
        }

        .ticket-message {
            font-size: 14px;
            color: #6b7280;
            margin-top: 8px;
        }

        .status-badge {
            padding: 4px 12px;
            border-radius: 12px;
            font-size: 12px;
            font-weight: 600;
        }

        .status-badge.open {
            background: #dbeafe;
            color: #1e40af;
        }

        .status-badge.in_progress {
            background: #fef3c7;
            color: #d97706;
        }

        .status-badge.resolved {
            background: #d1fae5;
            color: #065f46;
        }

        .priority-badge {
            padding: 4px 12px;
            border-radius: 12px;
            font-size: 12px;
            font-weight: 600;
        }

        .priority-badge.low {
            background: #e5e7eb;
            color: #6b7280;
        }

        .priority-badge.normal {
            background: #dbeafe;
            color: #1e40af;
        }

        .priority-badge.high {
            background: #fed7aa;
            color: #c2410c;
        }

        .priority-badge.urgent {
            background: #fee2e2;
            color: #dc2626;
        }

        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: #9ca3af;
        }

        @media (max-width: 768px) {
            .admin-navbar {
                flex-direction: column;
                gap: 16px;
            }

            .admin-nav-links {
                flex-direction: column;
                width: 100%;
            }

            .admin-nav-links a {
                width: 100%;
                text-align: center;
            }

            .container {
                padding: 0 16px;
            }
        }
    </style>
    <script src="admin/js/session-guard.js"></script>
    <link rel="stylesheet" href="admin/css/admin-shell.css">
    <script src="admin/js/admin-shell.js"></script>
</head>

<body>
    <div class="container">
        <h2>💬 Support Client</h2>

        <div class="stats-row">
            <div class="stat-box">
                <div class="number">12</div>
                <div class="label">Tickets Ouverts</div>
            </div>
            <div class="stat-box">
                <div class="number">5</div>
                <div class="label">En Cours</div>
            </div>
            <div class="stat-box">
                <div class="number">48</div>
                <div class="label">Résolus ce mois</div>
            </div>
            <div class="stat-box">
                <div class="number">2.5h</div>
                <div class="label">Temps Réponse Moyen</div>
            </div>
        </div>

        <div class="filters">
            <select id="statusFilter">
                <option value="">Tous les statuts</option>
                <option value="open">Ouvert</option>
                <option value="in_progress">En cours</option>
                <option value="resolved">Résolu</option>
            </select>
            <select id="priorityFilter">
                <option value="">Toutes les priorités</option>
                <option value="urgent">Urgent</option>
                <option value="high">Haute</option>
                <option value="normal">Normale</option>
                <option value="low">Basse</option>
            </select>
        </div>

        <div class="tickets-list" id="ticketsList">
            <div class="empty-state">⏳ Chargement...</div>
        </div>
    </div>

    <div class="modal-overlay" id="ticketModal" onclick="if(event.target===this) closeTicketModal()">
        <div class="modal-box">
            <div class="modal-box-header">
                <h3 id="modalTicketSubject"></h3>
                <button class="modal-close-btn" onclick="closeTicketModal()">&times;</button>
            </div>
            <div class="modal-box-body">
                <div class="modal-meta-row">
                    <span id="modalTicketUser"></span>
                    <span id="modalTicketDate"></span>
                    <span id="modalTicketPriority"></span>
                </div>
                <div class="modal-message-box" id="modalTicketMessage"></div>
                <div class="modal-actions">
                    <select id="modalStatusSelect">
                        <option value="open">Ouvert</option>
                        <option value="in_progress">En cours</option>
                        <option value="resolved">Résolu</option>
                    </select>
                    <select id="modalPrioritySelect">
                        <option value="low">Basse</option>
                        <option value="normal">Normale</option>
                        <option value="high">Haute</option>
                        <option value="urgent">Urgent</option>
                    </select>
                    <button onclick="saveTicketChanges()">Enregistrer</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        const API_BASE = 'https://swisscv-pro.dallyhermann-71e.workers.dev';

        function getAdminToken() { return localStorage.getItem('admin_token'); }
        function logout() {
            localStorage.removeItem('admin_token');
            localStorage.removeItem('admin_user');
            window.location.href = 'admin-login.html';
        }

        if (!getAdminToken()) window.location.href = 'admin-login.html';

        // Charger les statistiques support
        async function loadStats() {
            try {
                const response = await fetch(`${API_BASE}/admin/support/stats`, {
                    headers: { 'Authorization': `Bearer ${getAdminToken()}` }
                });
                const stats = await response.json();

                document.querySelector('.stats-row .stat-box:nth-child(1) .number').textContent = stats.open_tickets || 0;
                document.querySelector('.stats-row .stat-box:nth-child(2) .number').textContent = stats.in_progress_tickets || 0;
                document.querySelector('.stats-row .stat-box:nth-child(3) .number').textContent = stats.resolved_this_month || 0;
                document.querySelector('.stats-row .stat-box:nth-child(4) .number').textContent =
                    stats.avg_response_time_hours ? `${stats.avg_response_time_hours.toFixed(1)}h` : '0h';
            } catch (error) {
                console.error('Error loading stats:', error);
            }
        }

        // Charger les tickets
        let currentTickets = [];
        async function loadTickets() {
            try {
                const status = document.getElementById('statusFilter').value;
                const priority = document.getElementById('priorityFilter').value;

                const response = await fetch(
                    `${API_BASE}/admin/support/tickets?status=${status}&priority=${priority}`,
                    { headers: { 'Authorization': `Bearer ${getAdminToken()}` } }
                );
                const data = await response.json();

                currentTickets = data.tickets || [];
                renderTickets(currentTickets);
            } catch (error) {
                console.error('Error loading tickets:', error);
                document.getElementById('ticketsList').innerHTML =
                    '<div class="empty-state">Erreur de chargement des tickets</div>';
            }
        }

        // Afficher les tickets
        function renderTickets(tickets) {
            const container = document.getElementById('ticketsList');
            if (!tickets || tickets.length === 0) {
                container.innerHTML = '<div class="empty-state">Aucun ticket trouvé</div>';
                return;
            }

            container.innerHTML = tickets.map(ticket => `
                <div class="ticket-item" onclick="viewTicket(${ticket.id})">
                    <div class="ticket-header">
                        <div class="ticket-title">${ticket.subject}</div>
                        <div style="display: flex; gap: 8px;">
                            <span class="status-badge ${ticket.status}">${getStatusLabel(ticket.status)}</span>
                            <span class="priority-badge ${ticket.priority}">${getPriorityLabel(ticket.priority)}</span>
                        </div>
                    </div>
                    <div class="ticket-meta">
                        <span>👤 ${ticket.user_email || 'Utilisateur inconnu'}</span>
                        <span>🕐 ${formatTimeAgo(ticket.created_at)}</span>
                    </div>
                    <div class="ticket-message">${ticket.message}</div>
                </div>
            `).join('');
        }

        // Helpers
        function getStatusLabel(status) {
            const labels = {
                'open': 'Ouvert',
                'in_progress': 'En cours',
                'resolved': 'Résolu'
            };
            return labels[status] || status;
        }

        function getPriorityLabel(priority) {
            const labels = {
                'low': 'Basse',
                'normal': 'Normale',
                'high': 'Haute',
                'urgent': 'Urgent'
            };
            return labels[priority] || priority;
        }

        function formatTimeAgo(timestamp) {
            const now = Math.floor(Date.now() / 1000);
            const diff = now - timestamp;

            if (diff < 3600) return `Il y a ${Math.floor(diff / 60)} min`;
            if (diff < 86400) return `Il y a ${Math.floor(diff / 3600)}h`;
            return `Il y a ${Math.floor(diff / 86400)}j`;
        }

        function viewTicket(id) {
            const ticket = currentTickets.find(t => t.id === id);
            if (!ticket) return;

            document.getElementById('modalTicketSubject').textContent = ticket.subject;
            document.getElementById('modalTicketUser').textContent = '👤 ' + (ticket.user_email || 'Utilisateur inconnu');
            document.getElementById('modalTicketDate').textContent = '🕐 ' + formatTimeAgo(ticket.created_at);
            document.getElementById('modalTicketPriority').textContent = '⚑ ' + getPriorityLabel(ticket.priority);
            document.getElementById('modalTicketMessage').textContent = ticket.message;
            document.getElementById('modalStatusSelect').value = ticket.status;
            document.getElementById('modalPrioritySelect').value = ticket.priority;

            const modal = document.getElementById('ticketModal');
            modal.dataset.ticketId = id;
            modal.classList.add('open');
        }

        function closeTicketModal() {
            document.getElementById('ticketModal').classList.remove('open');
        }

        async function saveTicketChanges() {
            const modal = document.getElementById('ticketModal');
            const id = modal.dataset.ticketId;
            const status = document.getElementById('modalStatusSelect').value;
            const priority = document.getElementById('modalPrioritySelect').value;

            try {
                const response = await fetch(`${API_BASE}/admin/support/tickets/${id}`, {
                    method: 'PATCH',
                    headers: {
                        'Authorization': `Bearer ${getAdminToken()}`,
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ status, priority })
                });
                const data = await response.json();
                if (data.success) {
                    closeTicketModal();
                    loadTickets();
                } else {
                    alert('Erreur : ' + (data.error || 'Impossible de mettre à jour le ticket'));
                }
            } catch (error) {
                alert('Erreur de connexion');
            }
        }

        // Attendre que le DOM soit chargé
        // Initialiser quand le DOM est prêt
        function initPage() {
            if (typeof initNotifications === 'function') {
                initNotifications();
            }
            // Event listeners pour filtres
            document.getElementById('statusFilter').addEventListener('change', loadTickets);
            document.getElementById('priorityFilter').addEventListener('change', loadTickets);

            // Init
            loadStats();
            loadTickets();
        }

        // Exécuter immédiatement si DOM déjà chargé, sinon attendre
        if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', initPage);
        } else {
            initPage();
        }
    </script>
    <script src="admin/js/notifications.js"></script>
</body>

</html>
