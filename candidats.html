        .container {

        .page-header p {
            color: #666;
            font-size: 16px;
        }

            background: white;
            padding: 32px;
            border-radius: 12px;
            box-shadow: 0 2px 12px rgba(0, 0, 0, 0.08);

        }

        .card h2 {
            font-size: 20px;
            font-weight: 700;
            margin-bottom: 20px;

        .team-header {
            display: flex;
            justify-content: space-between;
            align-items: center;

        .team-info h1 {
            font-size: 28px;
            font-weight: 800;
            margin-bottom: 4px;
        }

        .team-info p {
            color: #666;
        }

        .btn {
            padding: 12px 24px;
            background: var(--swiss-red);
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
        }

        .btn:hover {
            background: #B80000;
            transform: translateY(-2px);
        }

        .btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
        }

        .btn-secondary {
            background: #F5F5F5;
            color: var(--swiss-black);
            border: 2px solid #E6E6E6;
        }

        .btn-secondary:hover {
            background: #E6E6E6;
            border-color: var(--swiss-black);
        }

        .btn-danger {
            background: #FFE5E5;
            color: #D50000;
            border: 2px solid #D50000;
        }

        .btn-danger:hover {
            background: #D50000;
            color: white;
        }

        .members-grid {
            display: grid;
            gap: 16px;
        }

        .member-card {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 16px;
            background: #F8F9FA;
            border-radius: 8px;
            border: 2px solid #E6E6E6;
        }

        .member-info {
            display: flex;
            align-items: center;
            gap: 12px;
            flex: 1;
        }

        .member-avatar {
            width: 48px;
            height: 48px;
            border-radius: 50%;

            display: flex;
            align-items: center;
            justify-content: center;

            font-size: 18px;
        }

        .member-details h3 {

            font-weight: 600;
            margin-bottom: 2px;
        }

        .member-details p {
            font-size: 14px;
            color: #666;
        }

        .member-actions {
            display: flex;
            gap: 8px;
        }

        .badge {

            border-radius: 12px;
            font-size: 12px;
            font-weight: 600;
        }

            color: black;
        }

        .badge.admin {
            background: #E3F2FD;
            color: #1976D2;
        }

        .badge.member {
            background: #E0E0E0;
            color: #666;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            font-size: 14px;
            font-weight: 600;
            margin-bottom: 8px;
        }

        input,
        select {
            width: 100%;
            padding: 12px 16px;
            font-size: 15px;
            border: 2px solid var(--swiss-gray);
            border-radius: 6px;

            border-color: var(--swiss-red);
        }

            padding: 60px 20px;

            color: #666;

            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.7);

            justify-content: center;
            padding: 20px;

            width: 100%;

            font-weight: 700;

            border: none;
            font-size: 32px;
            cursor: pointer;
            color: #666;
        }

            padding: 16px;
            border-radius: 8px;
            margin-bottom: 20px;
            display: none;
        }

        .success-message {
            background: #E8F5E9;
            border: 1px solid #4CAF50;
            color: #2E7D32;
        }

        .error-message {
            background: #FFE5E5;
            border: 1px solid #FF5252;

    <script>
        const API_BASE = "https://swisscv-pro.dallyhermann-71e.workers.dev";
        function getToken() { return localStorage.getItem("swisscv_token"); }
        function getUser() { const u = localStorage.getItem("swisscv_user"); return u ? JSON.parse(u) : null; }
        function logout() { localStorage.removeItem("swisscv_token"); localStorage.removeItem("swisscv_user"); window.location.href = "index.html"; }
        async function authenticatedFetch(endpoint, options = {}) {
            const token = getToken();
            if (!token) { window.location.href = "login.html"; throw new Error("Not authenticated"); }
            const response = await fetch(API_BASE + endpoint, { ...options, headers: { "Content-Type": "application/json", "Authorization": "Bearer " + token, ...options.headers } });
            if (response.status === 401) { logout(); throw new Error("Unauthorized"); }
            return response;
        }
    </script>

    <script>
        // ============ Dossiers candidats (plan Pro) ============
        const STATUS = { en_cours: 'En cours', en_poste: 'En poste', archive: 'Archivé' };
        const APP_STATUS = { a_postuler: 'À postuler', postule: 'Postulé', entretien: 'Entretien', offre: 'Offre', refuse: 'Refusé' };
        let listData = null;
        let current = null;

        function esc(v) { return String(v == null ? '' : v).replace(/[&<>"']/g, ch => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[ch])); }
        function fmtDate(ts) { return ts ? new Date(ts * 1000).toLocaleDateString('fr-CH') : ''; }
        function daysLeft(ts) { return Math.ceil((ts * 1000 - Date.now()) / 86400000); }
        function showMsg(id, text) { const d = document.getElementById(id); d.textContent = text; d.classList.add('show'); setTimeout(() => d.classList.remove('show'), 6000); window.scrollTo({ top: 0, behavior: 'smooth' }); }
        function ok(t) { showMsg('successMessage', t); }
        function ko(t) { showMsg('errorMessage', t); }
        function openModal(id) { document.getElementById(id).classList.add('show'); }
        function closeModal(id) { document.getElementById(id).classList.remove('show'); }
        async function api(path, options) {
            const res = await authenticatedFetch(path, options);
            let data = {}; try { data = await res.json(); } catch (e) { /* vide */ }
            return { ok: res.ok, status: res.status, data };
        }

        (async function init() {
            if (!getToken()) { window.location.href = 'login.html'; return; }
            // Quitter le mode candidat éventuellement actif dans cet onglet quand on revient à la liste
            const id = new URLSearchParams(location.search).get('id');
            if (id) await showDetail(id); else { try { sessionStorage.removeItem('swisscv_candidate'); } catch (e) { /* ignore */ } await showList(); }
        })();

        // ---------------- LISTE ----------------
        async function showList() {
            setLoading(true);
            const r = await api('/candidates');
            setLoading(false);
            if (!r.ok) { ko(r.data.error || 'Erreur de chargement'); return; }
            listData = r.data;
            const view = document.getElementById('view');
            if (!r.data.team) {
                view.innerHTML = '<div class="card" style="text-align:center;padding:56px 32px;"><h2 style="font-size:26px;margin-bottom:12px;">Dossiers candidats</h2>' +
                    '<p style="color:#666;max-width:560px;margin:0 auto 24px;line-height:1.6;">Les dossiers candidats sont réservés aux équipes du plan Pro : chaque conseiller y range les analyses, CV, lettres et candidatures des personnes qu\'il accompagne.</p>' +
                    '<a class="btn" href="team.html">Mon équipe</a> <a class="btn btn-secondary" href="pricing.html">Découvrir le plan Pro</a></div>';
                view.style.display = 'block';
                return;
            }
            const manager = r.data.team.role === 'owner' || r.data.team.role === 'admin';
            view.innerHTML = '<div class="card"><div class="team-header"><div class="team-info"><h1>Dossiers candidats</h1>' +
                '<p>' + esc(r.data.team.name) + ' · ' + (manager ? 'tous les dossiers de l\'équipe' : 'vos dossiers') + ' · conservés 12 mois après la dernière activité</p>' +
                (r.data.team.active ? '' : '<p style="color:#B80000;font-weight:600;margin-top:8px;">Équipe suspendue : consultation possible, création de dossiers bloquée.</p>') +
                '</div><div style="display:flex;gap:10px;flex-wrap:wrap;">' +
                '<a class="btn btn-secondary" href="team.html">Mon équipe</a>' +
                (r.data.team.active ? '<button class="btn" onclick="openNew()">+ Nouveau dossier</button>' : '') + '</div></div>' +
                '<div class="cand-toolbar"><input type="search" id="q" placeholder="Rechercher un candidat, un poste…" oninput="renderRows()">' +
                '<select id="fStatus" onchange="renderRows()"><option value="">Tous les statuts</option>' + Object.keys(STATUS).map(k => '<option value="' + k + '">' + STATUS[k] + '</option>').join('') + '</select></div>' +
                '<div class="cand-list" id="rows"></div></div>';
            view.style.display = 'block';
            renderRows();
        }

        function renderRows() {
            const q = (document.getElementById('q').value || '').toLowerCase();
            const st = document.getElementById('fStatus').value;
            const manager = listData.team.role === 'owner' || listData.team.role === 'admin';
            const rows = listData.candidates.filter(c => (!st || c.status === st) && (!q || (c.first_name + ' ' + c.last_name + ' ' + (c.target_job || '') + ' ' + (c.counsellor_name || '')).toLowerCase().includes(q)));
            document.getElementById('rows').innerHTML = rows.length ? rows.map(c => {
                const left = daysLeft(c.delete_at);
                return '<a class="cand-row" href="candidats.html?id=' + encodeURIComponent(c.id) + '"><div><h3>' + esc(c.first_name + ' ' + c.last_name) + '</h3>' +
                    '<div class="cand-meta">' + esc(c.target_job || 'Poste non précisé') + (manager ? ' · suivi par ' + esc(c.counsellor_name) : '') + ' · dernière activité le ' + fmtDate(c.last_activity_at) + '</div></div>' +
                    '<div class="cand-chips"><span class="chip ' + (c.status === 'en_poste' ? 'green' : c.status === 'archive' ? '' : 'dark') + '">' + esc(STATUS[c.status] || c.status) + '</span>' +
                    '<span class="chip">' + c.analyses_count + ' analyse(s)</span><span class="chip">' + c.cv_count + ' CV</span><span class="chip">' + c.documents_count + ' lettre(s)/cand.</span>' +
                    (left <= 60 ? '<span class="chip red">Suppression dans ' + Math.max(0, left) + ' j</span>' : '') + '</div></a>';
            }).join('') : '<p class="empty">' + (listData.candidates.length ? 'Aucun dossier ne correspond à la recherche.' : 'Aucun dossier pour le moment. Créez le premier avec « Nouveau dossier ».') + '</p>';
        }

        function openNew() {
            document.getElementById('newForm').reset();
            const manager = listData.team.role === 'owner' || listData.team.role === 'admin';
            const g = document.getElementById('nCounsellorGroup');
            if (manager && listData.counsellors.length > 1) {
                const me = (getUser() || {}).id;
                document.getElementById('nCounsellor').innerHTML = listData.counsellors.map(c => '<option value="' + esc(c.user_id) + '"' + (c.user_id === me ? ' selected' : '') + '>' + esc(c.full_name || c.email) + '</option>').join('');
                g.style.display = 'block';
            } else g.style.display = 'none';
            openModal('newModal');
        }

        document.getElementById('newForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const btn = document.getElementById('btnNew');
            btn.disabled = true;
            const body = {
                first_name: document.getElementById('nFirst').value.trim(), last_name: document.getElementById('nLast').value.trim(),
                email: document.getElementById('nEmail').value.trim(), target_job: document.getElementById('nJob').value.trim(),
                consent: document.getElementById('nConsent').checked
            };
            if (document.getElementById('nCounsellorGroup').style.display !== 'none') body.counsellor_id = document.getElementById('nCounsellor').value;
            const r = await api('/candidates', { method: 'POST', body: JSON.stringify(body) });
            btn.disabled = false;
            if (!r.ok) { ko(r.data.error || 'Erreur'); return; }
            closeModal('newModal');
            location.href = 'candidats.html?id=' + encodeURIComponent(r.data.candidate.id);
        });

        // ---------------- DÉTAIL ----------------
        async function showDetail(id) {
            setLoading(true);
            const r = await api('/candidates/' + encodeURIComponent(id));
            setLoading(false);
            if (!r.ok) { ko(r.data.error || 'Dossier introuvable'); setTimeout(() => location.href = 'candidats.html', 1800); return; }
            current = r.data;
            const c = r.data.candidate, manager = r.data.role === 'owner' || r.data.role === 'admin';
            const enc = encodeURIComponent(c.id);
            const left = daysLeft(c.delete_at);
            let counsellorField = '<span>' + esc(c.counsellor_name) + '</span>';
            if (manager) {
                const lr = await api('/candidates');
                const opts = (lr.data.counsellors || []).map(u => '<option value="' + esc(u.user_id) + '"' + (u.user_id === c.counsellor_id ? ' selected' : '') + '>' + esc(u.full_name || u.email) + '</option>').join('');
                if (opts) counsellorField = '<select id="dCounsellor" onchange="updateField(\'counsellor_id\', this.value)">' + opts + '</select>';
            }
            const v = document.getElementById('view');
            v.innerHTML =
                '<p style="margin-bottom:12px;"><a href="candidats.html" style="color:#666;">← Tous les dossiers</a></p>' +
                '<div class="card"><div class="team-header"><div class="team-info"><h1>' + esc(c.first_name + ' ' + c.last_name) + '</h1>' +
                '<p>' + esc(c.target_job || 'Poste non précisé') + (c.email ? ' · ' + esc(c.email) : '') + '</p>' +
                '<p class="item-sub" style="margin-top:6px;">Consentement attesté le ' + fmtDate(c.consent_at) + ' · ' + (left <= 60 ? '<strong style="color:#B80000;">suppression automatique dans ' + Math.max(0, left) + ' jour(s)</strong> (une nouvelle activité relance le délai)' : 'suppression automatique le ' + fmtDate(c.delete_at) + ' sans nouvelle activité') + '</p></div>' +
                '<div style="display:flex;gap:10px;flex-wrap:wrap;align-items:center;">' +
                '<select id="dStatus" onchange="updateField(\'status\', this.value)">' + Object.keys(STATUS).map(k => '<option value="' + k + '"' + (k === c.status ? ' selected' : '') + '>' + STATUS[k] + '</option>').join('') + '</select>' +
                '<button class="btn btn-secondary" onclick="exportJson()">Exporter</button><button class="btn btn-danger" onclick="deleteCandidate()">Supprimer</button></div></div>' +
                '<p class="item-sub" style="margin-top:10px;">Conseiller responsable : ' + counsellorField + '</p>' +
                (r.data.team_active ? '<div class="cand-actions">' +
                    '<a href="app.html?candidate=' + enc + '">Analyser un CV<small>1 crédit · score et recommandations</small></a>' +
                    '<a href="cv-templates.html?candidate=' + enc + '&new=1">Créer un CV suisse<small>générateur, 6 modèles</small></a>' +
                    '<a href="cover-letter.html?candidate=' + enc + '">Lettre de motivation<small>2 crédits</small></a>' +
                    '<a href="job-search.html?candidate=' + enc + '">Trouver une offre<small>puis candidature 1 clic (3 crédits)</small></a></div>' : '<p style="color:#B80000;margin-top:12px;">Équipe suspendue : les outils ne peuvent plus être utilisés pour ce dossier.</p>') +
                '</div>' +
                section('Analyses de CV', r.data.analyses.map(a =>
                    '<div class="item"><div class="item-head"><span class="item-title">Score ' + esc(a.score) + '/100 · ' + esc(a.filename || 'CV') + '</span><span class="item-sub">' + fmtDate(a.created_at) +
                    ' <button class="linkbtn grey" onclick="delItem(\'analyses\',\'' + esc(a.id) + '\')">Supprimer</button></span></div>' +
                    (a.improvements && a.improvements.length ? '<div class="item-sub" style="margin-top:6px;">À améliorer : ' + a.improvements.slice(0, 3).map(esc).join(' · ') + '</div>' : '') + '</div>').join(''), 'Aucune analyse. Utilisez « Analyser un CV » ci-dessus.') +
                section('CV suisses', r.data.cv_documents.map(d =>
                    '<div class="item"><div class="item-head"><span class="item-title">' + esc(d.name || 'CV') + '</span><span class="item-sub">modifié le ' + fmtDate(d.updated_at) +
                    ' <a class="linkbtn" href="cv-templates.html?candidate=' + enc + '&id=' + encodeURIComponent(d.id) + '">Ouvrir</a> <button class="linkbtn grey" onclick="delItem(\'cvs\',\'' + esc(d.id) + '\')">Supprimer</button></span></div></div>').join(''), 'Aucun CV. Utilisez « Créer un CV suisse » ci-dessus.') +
                section('Lettres et candidatures 1 clic', r.data.documents.map(d =>
                    '<div class="item"><div class="item-head"><span class="item-title">' + (d.kind === 'letter' ? 'Lettre · ' : 'Candidature 1 clic · ') + esc(d.title) + '</span><span class="item-sub">' + fmtDate(d.created_at) +
                    ' <button class="linkbtn" onclick="viewDoc(\'' + esc(d.id) + '\')">Voir</button> <button class="linkbtn grey" onclick="delItem(\'documents\',\'' + esc(d.id) + '\')">Supprimer</button></span></div></div>').join(''), 'Aucune lettre ni candidature générée pour ce candidat.') +
                section('Suivi des candidatures', '<form id="appForm" class="row2" style="margin-bottom:8px;"><input id="aTitle" placeholder="Poste *" required maxlength="160" style="padding:10px;border:1px solid #DDD;border-radius:8px;"><input id="aCompany" placeholder="Entreprise *" required maxlength="160" style="padding:10px;border:1px solid #DDD;border-radius:8px;">' +
                    '<input id="aUrl" placeholder="Lien de l\'offre (facultatif)" maxlength="500" style="padding:10px;border:1px solid #DDD;border-radius:8px;"><button class="btn" type="submit">Ajouter</button></form>' +
                    (r.data.applications.length ? r.data.applications.map(a =>
                        '<div class="item"><div class="item-head"><span class="item-title">' + esc(a.job_title) + ' · ' + esc(a.company) + (a.job_url ? ' <a class="linkbtn" target="_blank" rel="noopener" href="' + esc(a.job_url) + '">offre</a>' : '') + '</span><span class="item-sub">' +
                        '<select onchange="updateApp(\'' + esc(a.id) + '\', this.value)">' + Object.keys(APP_STATUS).map(k => '<option value="' + k + '"' + (k === a.status ? ' selected' : '') + '>' + APP_STATUS[k] + '</option>').join('') + '</select>' +
                        ' <button class="linkbtn grey" onclick="delItem(\'applications\',\'' + esc(a.id) + '\')">Supprimer</button></span></div></div>').join('') : '<p class="empty">Aucune candidature suivie.</p>'), null) +
                section('Notes de suivi', '<form id="noteForm" style="display:flex;gap:10px;margin-bottom:8px;"><textarea id="noteText" rows="2" maxlength="5000" placeholder="Compte rendu d\'entretien, prochaine étape…" style="flex:1;padding:10px;border:1px solid #DDD;border-radius:8px;font:inherit;"></textarea><button class="btn" type="submit">Ajouter</button></form>' +
                    (r.data.notes.length ? r.data.notes.map(n =>
                        '<div class="item"><div class="item-head"><span class="item-sub">' + esc(n.author_name) + ' · ' + fmtDate(n.created_at) + '</span><button class="linkbtn grey" onclick="delItem(\'notes\',\'' + esc(n.id) + '\')">Supprimer</button></div><div style="white-space:pre-wrap;margin-top:4px;">' + esc(n.note) + '</div></div>').join('') : '<p class="empty">Aucune note.</p>'), null);
            v.style.display = 'block';
            document.getElementById('appForm').addEventListener('submit', addApp);
            document.getElementById('noteForm').addEventListener('submit', addNote);
        }

        function section(title, inner, emptyText) {
            const content = inner || (emptyText ? '<p class="empty">' + emptyText + '</p>' : '');
            return '<div class="card"><h2>' + title + '</h2>' + content + '</div>';
        }

        async function updateField(field, value) {
            const body = {}; body[field] = value;
            const r = await api('/candidates/' + encodeURIComponent(current.candidate.id), { method: 'PUT', body: JSON.stringify(body) });
            if (r.ok) { ok('Dossier mis à jour'); await showDetail(current.candidate.id); } else ko(r.data.error || 'Erreur');
        }
        async function addNote(e) {
            e.preventDefault();
            const note = document.getElementById('noteText').value.trim();
            if (!note) return;
            const r = await api('/candidates/' + encodeURIComponent(current.candidate.id) + '/notes', { method: 'POST', body: JSON.stringify({ note }) });
            if (r.ok) await showDetail(current.candidate.id); else ko(r.data.error || 'Erreur');
        }
        async function addApp(e) {
            e.preventDefault();
            const body = { job_title: document.getElementById('aTitle').value.trim(), company: document.getElementById('aCompany').value.trim(), job_url: document.getElementById('aUrl').value.trim() };
            const r = await api('/candidates/' + encodeURIComponent(current.candidate.id) + '/applications', { method: 'POST', body: JSON.stringify(body) });
            if (r.ok) await showDetail(current.candidate.id); else ko(r.data.error || 'Erreur');
        }
        async function updateApp(appId, status) {
            const r = await api('/candidates/' + encodeURIComponent(current.candidate.id) + '/applications/' + encodeURIComponent(appId), { method: 'PUT', body: JSON.stringify({ status }) });
            if (r.ok) ok('Statut mis à jour'); else ko(r.data.error || 'Erreur');
        }
        async function delItem(kind, itemId) {
            if (!confirm('Supprimer définitivement cet élément du dossier ?')) return;
            const r = await api('/candidates/' + encodeURIComponent(current.candidate.id) + '/' + kind + '/' + encodeURIComponent(itemId), { method: 'DELETE' });
            if (r.ok) await showDetail(current.candidate.id); else ko(r.data.error || 'Erreur');
        }
        async function deleteCandidate() {
            const c = current.candidate;
            if (!confirm('Supprimer définitivement le dossier de ' + c.first_name + ' ' + c.last_name + ' ? Analyses, CV, lettres, candidatures et notes seront effacés. Cette action est irréversible.')) return;
            const r = await api('/candidates/' + encodeURIComponent(c.id), { method: 'DELETE' });
            if (r.ok) { try { sessionStorage.removeItem('swisscv_candidate'); } catch (e) { /* ignore */ } location.href = 'candidats.html'; } else ko(r.data.error || 'Erreur');
        }
        function viewDoc(docId) {
            const d = current.documents.find(x => x.id === docId);
            if (!d) return;
            const c = d.content || {};
            document.getElementById('docTitle').textContent = (d.kind === 'letter' ? 'Lettre — ' : 'Candidature 1 clic — ') + (d.title || '');
            let html = '';
            if (d.kind === 'letter') html = '<div class="doc-view">' + esc(c.letter) + '</div>';
            else html = '<p style="margin-bottom:10px;"><strong>Compatibilité : ' + esc(c.matchScore) + '/100</strong> ' + esc(c.matchLabel || '') + '</p>' +
                (c.summary ? '<p style="margin-bottom:10px;">' + esc(c.summary) + '</p>' : '') +
                (c.gaps && c.gaps.length ? '<p class="item-sub" style="margin-bottom:10px;">Écarts : ' + c.gaps.map(esc).join(' · ') + '</p>' : '') +
                '<h3 style="margin:12px 0 6px;">Lettre</h3><div class="doc-view">' + esc(c.coverLetter) + '</div>';
            const text = d.kind === 'letter' ? c.letter : c.coverLetter;
            html += '<button class="btn btn-secondary" style="margin-top:12px;" id="copyDoc">Copier la lettre</button>';
            document.getElementById('docBody').innerHTML = html;
            document.getElementById('copyDoc').addEventListener('click', () => navigator.clipboard.writeText(text || '').then(() => ok('Lettre copiée')).catch(() => ko('Copie impossible')));
            openModal('docModal');
        }
        function exportJson() {
            const c = current.candidate;
            const blob = new Blob([JSON.stringify(current, null, 2)], { type: 'application/json' });
            const a = document.createElement('a');
            a.href = URL.createObjectURL(blob);
            a.download = 'dossier-' + (c.first_name + '-' + c.last_name).toLowerCase().replace(/[^a-z0-9]+/g, '-') + '.json';
            a.click();
            setTimeout(() => URL.revokeObjectURL(a.href), 2000);
        }
        function setLoading(on) {
            document.getElementById('loading').style.display = on ? 'block' : 'none';
            if (on) document.getElementById('view').style.display = 'none';
        }
    </script>
    <script src="public/js/notifications.js?v=20260831a"></script>
    <script src="public/js/credits.js?v=20260821a"></script>
</body>
