        }

        body {

        .container {

        .page-header {
            margin-bottom: 32px;
        }

        .page-header h1 {
            font-size: 32px;
            font-weight: 800;
            margin-bottom: 8px;
        }

        .page-header p {
            color: #666;
            font-size: 16px;
        }

        .card {
            background: white;
            padding: 32px;
            border-radius: 12px;
            box-shadow: 0 2px 12px rgba(0, 0, 0, 0.08);
            margin-bottom: 24px;
        }

        .card h2 {
            font-size: 20px;
            font-weight: 700;
            margin-bottom: 20px;
        }

        .team-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 16px;
        }

        .team-info h1 {
            font-size: 28px;
            font-weight: 800;
            margin-bottom: 4px;
        }

        .team-info p {
            color: #666;
        }

        .btn {
            padding: 12px 24px;
            background: var(--swiss-red);
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
        }

        .btn:hover {
            background: #B80000;
            transform: translateY(-2px);
        }

        .btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
        }

        .btn-secondary {
            background: #F5F5F5;
            color: var(--swiss-black);
            border: 2px solid #E6E6E6;
        }

        .btn-secondary:hover {
            background: #E6E6E6;
            border-color: var(--swiss-black);
        }

        .btn-danger {
            background: #FFE5E5;
            color: #D50000;
            border: 2px solid #D50000;
        }

        .btn-danger:hover {
            background: #D50000;
            color: white;
        }

        .members-grid {
            display: grid;
            gap: 16px;
        }

        .member-card {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 16px;
            background: #F8F9FA;
            border-radius: 8px;
            border: 2px solid #E6E6E6;
        }

        .member-info {
            display: flex;
            align-items: center;
            gap: 12px;
            flex: 1;
        }

        .member-avatar {
            width: 48px;
            height: 48px;
            border-radius: 50%;
            background: linear-gradient(135deg, #D50000, #FF5252);
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-weight: 700;
            font-size: 18px;
        }

        .member-details h3 {
            font-size: 16px;
            font-weight: 600;
            margin-bottom: 2px;
        }

        .member-details p {
            font-size: 14px;
            color: #666;
        }

        .member-actions {
            display: flex;
            gap: 8px;
        }

        .badge {
            padding: 4px 12px;
            border-radius: 12px;
            font-size: 12px;
            font-weight: 600;
        }

        .badge.owner {
            background: linear-gradient(135deg, #FFD700, #FFA500);
            color: black;
        }

        .badge.admin {
            background: #E3F2FD;
            color: #1976D2;
        }

        .badge.member {
            background: #E0E0E0;
            color: #666;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            font-size: 14px;
            font-weight: 600;
            margin-bottom: 8px;
        }

        input,
        select {
            width: 100%;
            padding: 12px 16px;
            font-size: 15px;
            border: 2px solid var(--swiss-gray);
            border-radius: 6px;
            transition: all 0.2s;
        }

        input:focus,
        select:focus {
            outline: none;
            border-color: var(--swiss-red);
        }

        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: #999;
        }

        .empty-state .icon {
            font-size: 48px;
            margin-bottom: 16px;

            text-align: center;
            padding: 40px;
            font-size: 18px;
            color: #666;
        }

        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.7);
            z-index: 999999;
            align-items: center;
            justify-content: center;
            padding: 20px;
            box-sizing: border-box;

        .modal.show {

        }

        .modal-content {
            background: white;
            border-radius: 12px;
            max-width: 500px;
            width: 100%;
            max-height: 90vh;
            overflow-y: auto;
            padding: 32px;

            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 24px;
        }

        .modal-header h2 {
            font-size: 24px;
            font-weight: 700;
        }

        .modal-close {
            background: none;
            border: none;
            font-size: 32px;
            cursor: pointer;
            color: #666;
        }

        .success-message,
        .error-message {
            padding: 16px;
            border-radius: 8px;
            margin-bottom: 20px;
            display: none;
        }

        .success-message {
            background: #E8F5E9;
            border: 1px solid #4CAF50;
            color: #2E7D32;
        }

        .error-message {
            background: #FFE5E5;
            border: 1px solid #FF5252;
            color: #D50000;
        }

        .error-message.show {
            display: block;

    <script>
        const API_BASE = "https://swisscv-pro.dallyhermann-71e.workers.dev";
        function getToken() { return localStorage.getItem("swisscv_token"); }
        function getUser() { const u = localStorage.getItem("swisscv_user"); return u ? JSON.parse(u) : null; }
        function logout() { localStorage.removeItem("swisscv_token"); localStorage.removeItem("swisscv_user"); window.location.href = "index.html"; }
        async function authenticatedFetch(endpoint, options = {}) {
            const token = getToken();
            if (!token) { window.location.href = "login.html"; throw new Error("Not authenticated"); }
            const response = await fetch(API_BASE + endpoint, { ...options, headers: { "Content-Type": "application/json", "Authorization": "Bearer " + token, ...options.headers } });
            if (response.status === 401) { logout(); throw new Error("Unauthorized"); }
            return response;
        }
    </script>

                    b.classList.remove('active');

        // Close user menu when clicking on menu items

        function toggleDropdown(event, button) {

                dropdown.classList.toggle('active');
            }
        }

        document.querySelectorAll('.navbar-link, .navbar-btn, .dropdown-item').forEach(l => {
            l.addEventListener('click', () => {
                if (window.innerWidth <= 1024) {
                    const m = document.getElementById('navbarMenu');
                    const b = document.querySelector('.navbar-burger');
                    m.classList.remove('active');
                    b.classList.remove('active');
                }
            })
        });

        // Close user menu when clicking on menu items
        document.querySelectorAll('.user-menu-item').forEach(item => {
            item.addEventListener('click', () => {
                const dropdown = document.getElementById('userMenuDropdown');
                if (dropdown) {
                    dropdown.classList.remove('show');
                }
            });
        });

        (function () {
            const u = getUser();
            const planBadge = document.getElementById("planBadge");
            const cvToolsMenu = document.getElementById("cvToolsMenu");
            const teamLink = document.getElementById("teamLink");

            if (u && planBadge) {
                const tier = u.subscription_tier || u.tier || 'free';
                planBadge.textContent = tier.charAt(0).toUpperCase() + tier.slice(1);
                planBadge.className = `plan-badge ${tier}`;
                // Mettre à jour le nom et l'email de l'utilisateur dans le menu
                const userNameEl = document.querySelector('.user-menu-name');
                const userEmailEl = document.getElementById('userEmail');
                const userAvatarCircle = document.querySelector('.user-avatar-circle');

                if (userNameEl && u.name) {
                    userNameEl.textContent = u.name;
                }

                if (userEmailEl && u.email) {
                    userEmailEl.textContent = u.email;
                }

                // Mettre à jour l'avatar avec l'initiale du nom ou email
                if (userAvatarCircle) {
                    const initial = u.name ? u.name.charAt(0).toUpperCase() : 
                                   u.email ? u.email.charAt(0).toUpperCase() : 'U';
                    userAvatarCircle.textContent = initial;
                }


                // Afficher menu Outils CV pour Premium/Pro
                if (cvToolsMenu && (tier === 'premium' || tier === 'pro')) {
                    cvToolsMenu.style.display = 'inline-block';
                }

                // Afficher lien Équipe pour Pro
                if (tier === 'pro' && teamLink) {
                    teamLink.style.display = 'inline-block';
                }

        })();

            </form>

    <script>
        // ============ Équipe (plan Pro) ============
        let teamData = null;
        let userRole = null;
        const ROLE_LABELS = { owner: 'Propriétaire', admin: 'Admin', member: 'Membre' };
        const INVITE_KEY = 'swisscv_pending_invite';

        function esc(v) {
            return String(v == null ? '' : v).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;').replace(/'/g, '&#39;');
        }
        function getRoleLabel(role) { return ROLE_LABELS[role] || role; }
        function fmtDate(ts) { return ts ? new Date(ts * 1000).toLocaleDateString('fr-CH') : ''; }
        function showMsg(id, text) {
            const div = document.getElementById(id);
            div.textContent = text;
            div.classList.add('show');
            setTimeout(() => div.classList.remove('show'), 6000);
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }
        function showSuccess(text) { showMsg('successMessage', text); }
        function showError(text) { showMsg('errorMessage', text); }
        async function api(path, options) {
            const res = await authenticatedFetch(path, options);
            let data = {};
            try { data = await res.json(); } catch (e) { /* réponse vide */ }
            return { ok: res.ok, status: res.status, data };
        }

        (async function init() {
            const params = new URLSearchParams(window.location.search);
            const invite = params.get('invite');
            if (invite && /^[a-f0-9]{32,64}$/i.test(invite)) {
                // Pas connecté : on garde l'invitation et on revient ici après connexion / inscription
                if (!getToken()) {
                    try { localStorage.setItem(INVITE_KEY, invite); } catch (e) { /* stockage bloqué */ }
                    window.location.href = 'login.html';
                    return;
                }
                await acceptInvitation(invite);
                window.history.replaceState({}, document.title, window.location.pathname);
            }
            if (!getToken()) { window.location.href = 'login.html'; return; }
            await loadTeam();
        })();

        async function acceptInvitation(token) {
            try {
                const r = await api('/teams/invitations/' + encodeURIComponent(token) + '/accept', { method: 'POST' });
                try { localStorage.removeItem(INVITE_KEY); } catch (e) { /* ignore */ }
                if (r.ok) showSuccess('Invitation acceptée : bienvenue dans l\'équipe « ' + (r.data.team && r.data.team.name || '') + ' » !');
                else showError(r.data.error || 'Impossible d\'accepter cette invitation');
            } catch (e) {
                showError('Erreur de connexion');
            }
        }

        async function loadTeam() {
            const loading = document.getElementById('loading');
            const content = document.getElementById('teamContent');
            loading.style.display = 'block';
            content.style.display = 'none';
            try {
                const r = await api('/teams/my-team');
                if (!r.ok) { showError(r.data.error || 'Erreur lors du chargement de l\'équipe'); return; }
                if (r.data.team) {
                    teamData = r.data.team;
                    userRole = r.data.role;
                    renderTeam(r.data);
                } else {
                    teamData = null;
                    userRole = null;
                    renderNoTeam(r.data.invitations_received || []);
                }
                content.style.display = 'block';
            } catch (error) {
                showError('Erreur lors du chargement de l\'équipe');
            } finally {
                loading.style.display = 'none';
            }
        }

        function renderNoTeam(received) {
            const user = getUser() || {};
            const isPro = (user.tier || user.subscription_tier) === 'pro';
            let html = '';
            if (received.length) {
                html += '<div class="card"><h2>Invitations reçues</h2><div class="members-grid">' + received.map(inv =>
                    '<div class="member-card"><div class="member-info"><div class="member-details"><h3>' + esc(inv.team_name) + '</h3>' +
                    '<p>Rôle proposé : ' + esc(getRoleLabel(inv.role)) + ' · valable jusqu\'au ' + esc(fmtDate(inv.expires_at)) + '</p></div></div>' +
                    '<div class="member-actions"><button class="btn" data-accept="' + esc(inv.token) + '">Rejoindre</button>' +
                    '<button class="btn btn-secondary" data-decline="' + esc(inv.id) + '">Refuser</button></div></div>'
                ).join('') + '</div></div>';
            }
            if (isPro) {
                html += '<div class="card" style="text-align:center;padding:56px 32px;">' +
                    '<h2 style="font-size:26px;margin-bottom:12px;">Créez l\'équipe de votre cabinet</h2>' +
                    '<p style="color:#666;margin:0 auto 28px;max-width:560px;line-height:1.6;">Invitez jusqu\'à 4 conseillers (5 places avec vous). Ils utilisent les crédits de votre abonnement Pro, et vous suivez leur consommation mois par mois.</p>' +
                    '<button class="btn" onclick="createTeam()">Créer mon équipe</button></div>';
            } else if (!received.length) {
                html += '<div class="card" style="text-align:center;padding:56px 32px;">' +
                    '<h2 style="font-size:26px;margin-bottom:12px;">Les équipes font partie du plan Pro</h2>' +
                    '<p style="color:#666;margin:0 auto 28px;max-width:560px;line-height:1.6;">Le plan Pro permet à un cabinet (outplacement, coaching, conseil en carrière) de partager ses crédits avec ses conseillers. Si vous avez reçu une invitation, ouvrez le lien de l\'email en étant connecté(e) avec l\'adresse invitée.</p>' +
                    '<a class="btn" href="pricing.html">Découvrir le plan Pro</a></div>';
            }
            const content = document.getElementById('teamContent');
            content.innerHTML = html;
            content.querySelectorAll('[data-accept]').forEach(b => b.addEventListener('click', async () => { await acceptInvitation(b.dataset.accept); await loadTeam(); }));
            content.querySelectorAll('[data-decline]').forEach(b => b.addEventListener('click', async () => {
                const r = await api('/teams/invitations/' + encodeURIComponent(b.dataset.decline), { method: 'DELETE' });
                if (r.ok) { showSuccess('Invitation refusée'); await loadTeam(); } else showError(r.data.error || 'Erreur');
            }));
        }

        function renderTeam(data) {
            const isOwner = userRole === 'owner';
            const isManager = isOwner || userRole === 'admin';
            const credits = data.credits || {};
            const members = data.members || [];
            const pending = data.pending_invitations || [];
            const seatsLeft = Math.max(0, (teamData.max_members || 5) - (teamData.seats_used || members.length));
            let html = '';

            html += '<div class="card"><div class="team-header"><div class="team-info">' +
                '<h1>' + esc(teamData.name) + '</h1>' +
                '<p>' + members.length + ' membre(s) · ' + (teamData.seats_used || members.length) + '/' + esc(teamData.max_members) + ' places utilisées · votre rôle : ' + esc(getRoleLabel(userRole)) + '</p>' +
                (teamData.active ? '' : '<p style="color:#B80000;font-weight:600;margin-top:8px;">Équipe suspendue : l\'abonnement Pro du propriétaire n\'est plus actif. Chacun utilise ses propres crédits.</p>') +
                '</div><div style="display:flex;gap:12px;flex-wrap:wrap;">' +
                '<a class="btn" href="candidats.html">Dossiers candidats</a>' +
                (isOwner ? '<button class="btn btn-secondary" onclick="showRenameModal()">Renommer</button><button class="btn btn-danger" onclick="deleteTeam()">Supprimer l\'équipe</button>' : '<button class="btn btn-secondary" onclick="leaveTeam()">Quitter l\'équipe</button>') +
                '</div></div></div>';

            html += '<div class="card"><h2>Crédits de l\'équipe</h2>' +
                '<div style="display:flex;gap:16px;flex-wrap:wrap;margin-top:12px;">' +
                '<div style="flex:1;min-width:160px;background:#FFF5F5;border-radius:12px;padding:18px;"><div style="font-size:13px;color:#666;">Solde disponible</div><div style="font-size:32px;font-weight:800;">' + esc(credits.balance) + '</div><div style="font-size:12px;color:#888;">sur ' + esc(credits.monthly_limit) + ' par mois</div></div>' +
                (isManager ? '<div style="flex:1;min-width:160px;background:#F6F7F9;border-radius:12px;padding:18px;"><div style="font-size:13px;color:#666;">Consommés ce mois-ci</div><div style="font-size:32px;font-weight:800;">' + esc(credits.used_this_month || 0) + '</div><div style="font-size:12px;color:#888;">par l\'ensemble de l\'équipe</div></div>' : '') +
                '</div><p style="font-size:13px;color:#666;margin-top:14px;line-height:1.5;">Les outils (analyse, lettres, candidatures…) utilisent d\'abord ces crédits partagés, puis, s\'ils sont épuisés, les crédits personnels de chacun.</p></div>';

            html += '<div class="card"><h2>Membres de l\'équipe</h2><div class="members-grid">' + members.map(m => {
                const name = m.full_name || m.email;
                const canManage = m.role !== 'owner' && (isOwner || (userRole === 'admin' && m.role === 'member'));
                return '<div class="member-card"><div class="member-info">' +
                    '<div class="member-avatar">' + esc(String(name || '?').substring(0, 2).toUpperCase()) + '</div>' +
                    '<div class="member-details"><h3>' + esc(name) + '</h3><p>' + esc(m.email) +
                    (isManager && m.credits_used_month !== undefined ? ' · ' + esc(m.credits_used_month) + ' crédit(s) ce mois-ci' : '') + '</p></div>' +
                    '<span class="badge ' + esc(m.role) + '">' + esc(getRoleLabel(m.role)) + '</span></div>' +
                    '<div class="member-actions">' +
                    (isOwner && m.role !== 'owner' ? '<button class="btn btn-secondary" data-role="' + esc(m.id) + '" data-current="' + esc(m.role) + '">' + (m.role === 'admin' ? 'Passer membre' : 'Passer admin') + '</button>' : '') +
                    (canManage ? '<button class="btn btn-danger" data-remove="' + esc(m.id) + '" data-name="' + esc(name) + '">Retirer</button>' : '') +
                    '</div></div>';
            }).join('') + '</div></div>';

            if (isManager && pending.length) {
                html += '<div class="card"><h2>Invitations en attente</h2><div class="members-grid">' + pending.map(inv =>
                    '<div class="member-card"><div class="member-info"><div class="member-details"><h3>' + esc(inv.email) + '</h3>' +
                    '<p>Invité(e) le ' + esc(fmtDate(inv.created_at)) + ' · expire le ' + esc(fmtDate(inv.expires_at)) + '</p></div>' +
                    '<span class="badge ' + esc(inv.role) + '">' + esc(getRoleLabel(inv.role)) + '</span></div>' +
                    '<div class="member-actions"><button class="btn btn-danger" data-cancel="' + esc(inv.id) + '">Annuler</button></div></div>'
                ).join('') + '</div></div>';
            }

            if (isManager && teamData.active) {
                html += '<div class="card"><h2>Inviter un conseiller</h2>' +
                    (seatsLeft > 0 ? '<p style="color:#666;margin-bottom:16px;">' + seatsLeft + ' place(s) disponible(s). La personne reçoit un email avec un lien pour rejoindre l\'équipe (valable 7 jours).</p>' +
                        '<form id="inviteForm"><div class="form-group"><label for="inviteEmail">Email du conseiller</label>' +
                        '<input type="email" id="inviteEmail" required placeholder="prenom.nom@cabinet.ch"></div>' +
                        (isOwner ? '<div class="form-group"><label for="inviteRole">Rôle</label><select id="inviteRole"><option value="member">Membre</option><option value="admin">Admin (peut inviter des membres)</option></select></div>' : '') +
                        '<button type="submit" class="btn" id="btnInvite">Envoyer l\'invitation</button></form><div id="inviteLinkBox" style="display:none;margin-top:16px;"></div>'
                        : '<p style="color:#666;">Toutes les places sont utilisées. Retirez un membre ou annulez une invitation pour en libérer une.</p>') +
                    '</div>';
            }

            const content = document.getElementById('teamContent');
            content.innerHTML = html;
            content.querySelectorAll('[data-role]').forEach(b => b.addEventListener('click', () => changeRole(b.dataset.role, b.dataset.current)));
            content.querySelectorAll('[data-remove]').forEach(b => b.addEventListener('click', () => removeMember(b.dataset.remove, b.dataset.name)));
            content.querySelectorAll('[data-cancel]').forEach(b => b.addEventListener('click', () => cancelInvitation(b.dataset.cancel)));
            const form = document.getElementById('inviteForm');
            if (form) form.addEventListener('submit', inviteMember);
        }

        async function inviteMember(event) {
            event.preventDefault();
            const email = document.getElementById('inviteEmail').value.trim();
            const roleEl = document.getElementById('inviteRole');
            const role = roleEl ? roleEl.value : 'member';
            const btn = document.getElementById('btnInvite');
            btn.disabled = true;
            btn.textContent = 'Envoi…';
            try {
                const r = await api('/teams/invite', { method: 'POST', body: JSON.stringify({ email, role }) });
                if (!r.ok) { showError(r.data.error || 'Erreur lors de l\'invitation'); return; }
                await loadTeam();
                showSuccess(r.data.email_sent ? 'Invitation envoyée à ' + email : 'Invitation créée, mais l\'email n\'a pas pu être envoyé : transmettez le lien ci-dessous.');
                const box = document.getElementById('inviteLinkBox');
                if (box && r.data.invite_link) {
                    box.style.display = 'block';
                    box.innerHTML = '<p style="font-size:13px;color:#666;margin-bottom:8px;">Lien d\'invitation (à transmettre uniquement à ' + esc(email) + ') :</p>' +
                        '<div style="display:flex;gap:8px;"><input type="text" readonly id="inviteLinkInput" value="' + esc(r.data.invite_link) + '" style="flex:1;">' +
                        '<button type="button" class="btn btn-secondary" id="copyInviteLink">Copier</button></div>';
                    document.getElementById('copyInviteLink').addEventListener('click', () => {
                        navigator.clipboard.writeText(r.data.invite_link).then(() => showSuccess('Lien copié')).catch(() => showError('Copie impossible'));
                    });
                }
            } catch (error) {
                showError('Erreur de connexion');
            } finally {
                const b = document.getElementById('btnInvite');
                if (b) { b.disabled = false; b.textContent = 'Envoyer l\'invitation'; }
            }
        }

        async function removeMember(memberId, memberName) {
            if (!confirm('Retirer ' + memberName + ' de l\'équipe ?')) return;
            const r = await api('/teams/members/' + encodeURIComponent(memberId), { method: 'DELETE' });
            if (r.ok) { showSuccess(memberName + ' a été retiré(e) de l\'équipe'); await loadTeam(); } else showError(r.data.error || 'Erreur lors du retrait');
        }

        async function changeRole(memberId, currentRole) {
            const role = currentRole === 'admin' ? 'member' : 'admin';
            const r = await api('/teams/members/' + encodeURIComponent(memberId) + '/role', { method: 'PUT', body: JSON.stringify({ role }) });
            if (r.ok) { showSuccess('Rôle modifié'); await loadTeam(); } else showError(r.data.error || 'Erreur lors du changement de rôle');
        }

        async function cancelInvitation(invitationId) {
            if (!confirm('Annuler cette invitation ?')) return;
            const r = await api('/teams/invitations/' + encodeURIComponent(invitationId), { method: 'DELETE' });
            if (r.ok) { showSuccess('Invitation annulée'); await loadTeam(); } else showError(r.data.error || 'Erreur lors de l\'annulation');
        }

        async function leaveTeam() {
            if (!confirm('Quitter l\'équipe « ' + teamData.name + ' » ? Vous utiliserez ensuite vos propres crédits.')) return;
            const r = await api('/teams/leave', { method: 'POST' });
            if (r.ok) { showSuccess('Vous avez quitté l\'équipe'); await loadTeam(); } else showError(r.data.error || 'Erreur');
        }

        function showRenameModal() {
            document.getElementById('newTeamName').value = teamData.name;
            document.getElementById('renameModal').classList.add('show');
        }
        function closeRenameModal() { document.getElementById('renameModal').classList.remove('show'); }

        async function renameTeam(event) {
            event.preventDefault();
            const name = document.getElementById('newTeamName').value.trim();
            const r = await api('/teams/' + encodeURIComponent(teamData.id), { method: 'PUT', body: JSON.stringify({ name }) });
            if (r.ok) { closeRenameModal(); showSuccess('Équipe renommée'); await loadTeam(); } else showError(r.data.error || 'Erreur lors du renommage');
        }

        async function deleteTeam() {
            if (!confirm('Supprimer l\'équipe ? Tous les membres seront retirés et les invitations annulées. Cette action est irréversible.')) return;
            if (prompt('Pour confirmer, tapez SUPPRIMER :') !== 'SUPPRIMER') return;
            const r = await api('/teams/' + encodeURIComponent(teamData.id), { method: 'DELETE' });
            if (r.ok) { showSuccess('Équipe supprimée'); await loadTeam(); } else showError(r.data.error || 'Erreur lors de la suppression');
        }

        function createTeam() { document.getElementById('createTeamModal').classList.add('show'); }
        function closeCreateTeamModal() {
            document.getElementById('createTeamModal').classList.remove('show');
            document.getElementById('createTeamName').value = '';
        }

        async function submitCreateTeam(event) {
            event.preventDefault();
            const name = document.getElementById('createTeamName').value.trim();
            const btn = document.getElementById('btnCreateTeam');
            if (btn) { btn.disabled = true; btn.textContent = 'Création…'; }
            try {
                const r = await api('/teams/create', { method: 'POST', body: JSON.stringify({ name }) });
                if (r.ok) { closeCreateTeamModal(); showSuccess('Équipe créée : invitez maintenant vos conseillers'); await loadTeam(); }
                else showError(r.data.error || 'Erreur lors de la création');
            } catch (e) {
                showError('Erreur de connexion');
            } finally {
                if (btn) { btn.disabled = false; btn.textContent = 'Créer l\'équipe'; }
            }
        }
    </script>
